<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a20"/>
      <stop offset="100%" style="stop-color:#0d0d12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bda8"/>
      <stop offset="100%" style="stop-color:#2d9d8a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#38bda8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#38bda8;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Glow effect -->
  <ellipse cx="256" cy="200" rx="140" ry="100" fill="url(#glowGrad)"/>
  
  <!-- Chip/Hardware base shape -->
  <rect x="136" y="136" width="240" height="240" rx="24" fill="#252530" stroke="#38bda8" stroke-width="3"/>
  
  <!-- Chip pins - top -->
  <rect x="176" y="112" width="24" height="36" rx="4" fill="#38bda8"/>
  <rect x="224" y="112" width="24" height="36" rx="4" fill="#38bda8"/>
  <rect x="264" y="112" width="24" height="36" rx="4" fill="#38bda8"/>
  <rect x="312" y="112" width="24" height="36" rx="4" fill="#38bda8"/>
  
  <!-- Chip pins - bottom -->
  <rect x="176" y="364" width="24" height="36" rx="4" fill="#38bda8"/>
  <rect x="224" y="364" width="24" height="36" rx="4" fill="#38bda8"/>
  <rect x="264" y="364" width="24" height="36" rx="4" fill="#38bda8"/>
  <rect x="312" y="364" width="24" height="36" rx="4" fill="#38bda8"/>
  
  <!-- Chip pins - left -->
  <rect x="112" y="176" width="36" height="24" rx="4" fill="#38bda8"/>
  <rect x="112" y="224" width="36" height="24" rx="4" fill="#38bda8"/>
  <rect x="112" y="264" width="36" height="24" rx="4" fill="#38bda8"/>
  <rect x="112" y="312" width="36" height="24" rx="4" fill="#38bda8"/>
  
  <!-- Chip pins - right -->
  <rect x="364" y="176" width="36" height="24" rx="4" fill="#38bda8"/>
  <rect x="364" y="224" width="36" height="24" rx="4" fill="#38bda8"/>
  <rect x="364" y="264" width="36" height="24" rx="4" fill="#38bda8"/>
  <rect x="364" y="312" width="36" height="24" rx="4" fill="#38bda8"/>
  
  <!-- Inner chip area -->
  <rect x="168" y="168" width="176" height="176" rx="16" fill="#1a1a24"/>
  
  <!-- Ghost/Phantom symbol -->
  <path d="M256 200 C208 200 176 236 176 280 L176 320 C176 324 180 328 184 328 L200 328 L200 312 C200 308 204 304 208 304 C212 304 216 308 216 312 L216 328 L240 328 L240 312 C240 308 244 304 248 304 C252 304 256 308 256 312 L256 328 L272 328 L272 312 C272 308 276 304 280 304 C284 304 288 308 288 312 L288 328 L304 328 L304 312 C304 308 308 304 312 304 C316 304 320 308 320 312 L320 328 L328 328 C332 328 336 324 336 320 L336 280 C336 236 304 200 256 200 Z" fill="url(#accentGrad)"/>
  
  <!-- Ghost eyes -->
  <ellipse cx="224" cy="256" rx="16" ry="20" fill="#1a1a24"/>
  <ellipse cx="288" cy="256" rx="16" ry="20" fill="#1a1a24"/>
  
  <!-- Eye highlights -->
  <ellipse cx="228" cy="252" rx="6" ry="8" fill="#38bda8" opacity="0.8"/>
  <ellipse cx="292" cy="252" rx="6" ry="8" fill="#38bda8" opacity="0.8"/>
